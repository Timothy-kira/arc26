[project]
name = "arc26"
version = "0.1.0"
description = "ARC-AGI-3 agent: Qwen3.8-27B driven by a lean harness with Raven-style DAG scheduling, skill sedimentation and self-evolution"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "arc-agi>=0.9.8",
    "arcengine>=0.9.3",
    "numpy>=2",
    "pydantic>=2",
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
kaggle = ["kaggle>=2.2", "pandas", "pyarrow"]

[project.scripts]
arc26 = "arc_harness.run:main"
arc26-evolve = "evolve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arc_harness", "evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
